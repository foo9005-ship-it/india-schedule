let cur=0;
function badge(d){return`<span class="badge" style="background:${d.bc};color:${d.tc}">${d.city}</span>`;}
function renderList(){document.getElementById('list-rows').innerHTML=days.map((d,i)=>`<div class="list-row" onclick="goDetail(${i})"><span class="date-c">${d.date}</span><span>${badge(d)}</span><span class="act-c">${d.acts.map(a=>(a.t?a.t+' ':'')+a.m).join('　')}</span></div>`).join('');}
function renderSelect(){const s=document.getElementById('day-select');s.innerHTML=days.map((d,i)=>`<option value="${i}">${d.date}　${d.city}</option>`).join('');s.onchange=e=>{cur=parseInt(e.target.value);renderDetail();};}
function renderDetail(){
  const d=days[cur];
  document.getElementById('day-select').value=cur;
  const fl=d.flights.length?`<div class="sec-label">移動</div>${d.flights.map(f=>`<div class="flight-box"><div class="flight-name">${f.fn}${f.ok?'<span class="confirmed">✓確定</span>':''}</div><div class="flight-info">${f.dep} → ${f.arr}${f.note?'　'+f.note:''}</div></div>`).join('')}`:'';
  const ht=`<div class="sec-label">宿泊</div><div class="card" style="padding:10px 14px;">${d.hotelUrl?`<a class="hotel-link" href="${d.hotelUrl}">${d.hotel}</a>`:`<span style="font-size:13px;color:#888">${d.hotel}</span>`}</div>`;
  const ac=`<div class="sec-label">活動スケジュール</div><div class="card" style="padding:10px 14px;">${d.acts.map(a=>`<div class="act-row"><span class="act-time">${a.t||''}</span><span class="act-main">${a.m}${a.s?`<div class="act-sub">${a.s}</div>`:''}</span></div>`).join('')}</div>`;
  const nt=d.note?`<div class="note-box">${d.note}</div>`:'';
  document.getElementById('detail-content').innerHTML=`<div class="card"><div class="day-title">${d.date}</div><div style="margin-bottom:6px">${badge(d)}</div>${fl}${ht}${ac}${nt}</div>`;
}
function goDetail(i){cur=i;document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));document.querySelectorAll('.view').forEach(t=>t.classList.remove('active'));document.querySelectorAll('.tab')[1].classList.add('active');document.getElementById('view-detail').classList.add('active');renderDetail();}
function showView(v){document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));document.querySelectorAll('.view').forEach(t=>t.classList.remove('active'));if(v==='list'){document.querySelectorAll('.tab')[0].classList.add('active');document.getElementById('view-list').classList.add('active');}else{document.querySelectorAll('.tab')[1].classList.add('active');document.getElementById('view-detail').classList.add('active');renderDetail();}}
function changeDay(d){cur=Math.max(0,Math.min(days.length-1,cur+d));renderDetail();}
renderList();renderSelect();
</script>
